<!-- Main -->

<div class="col-md-10">

<div class="d-flex justify-content-between align-items-center mt-4 mb-4">

<h2>Testimonials</h2>

<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#testimonialModal">

<i class="bi bi-plus-circle"></i>

Add Testimonial

</button>

</div>

<div class="card shadow">

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Photo</th>

<th>Name</th>

<th>Company</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="testimonialTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Modal -->

<div class="modal fade"
id="testimonialModal"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Testimonial

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="testimonialForm">

<div class="mb-3">

<label>Name</label>

<input
type="text"
id="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Company</label>

<input
type="text"
id="company"
class="form-control">

</div>

<div class="mb-3">

<label>Position</label>

<input
type="text"
id="position"
class="form-control">

</div>

<div class="mb-3">

<label>Photo</label>

<input
type="file"
id="image"
class="form-control"
accept="image/*">

</div>

<div class="mb-3">

<label>Rating</label>

<select
id="rating"
class="form-select">

<option value="5">★★★★★</option>
<option value="4">★★★★</option>
<option value="3">★★★</option>
<option value="2">★★</option>
<option value="1">★</option>

</select>

</div>

<div class="mb-3">

<label>Testimonial</label>

<textarea
id="testimonial"
rows="5"
class="form-control"
required></textarea>

</div>

<div class="mb-3">

<label>Status</label>

<select
id="status"
class="form-select">

<option value="active">Active</option>
<option value="inactive">Inactive</option>

</select>

</div>

<button
id="form-submit"
type="submit"
class="btn btn-success">

Save Testimonial

</button>

</form>

</div>

</div>

</div>

</div>
