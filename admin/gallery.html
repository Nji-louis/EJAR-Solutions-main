<!-- Main Content -->

<div class="col-md-10">

<div class="d-flex justify-content-between align-items-center mt-4 mb-4">

<h2>Gallery Management</h2>

<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#galleryModal">

<i class="bi bi-plus-circle"></i>

Add Image

</button>

</div>

<div class="card shadow">

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Title</th>

<th>Image</th>

<th>Category</th>

<th>Created</th>

<th width="170">Actions</th>

</tr>

</thead>

<tbody id="galleryTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Gallery Modal -->

<div class="modal fade"
id="galleryModal"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Gallery Image

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="galleryForm">

<input
type="hidden"
id="galleryId">



<div class="mb-3">

<label class="form-label">

Title

</label>

<input
type="text"
id="title"
class="form-control"
required>

</div>





<div class="mb-3">

<label class="form-label">
Image
</label>

<input
type="file"
id="imageFile"
class="form-control"
accept="image/*">

<input
type="hidden"
id="image">

<small
id="uploadStatus"
class="text-success">
</small>

</div>

<div class="mb-3">

<label class="form-label">

Category

</label>

<select
id="category"
class="form-select"
required>

<option value="">Select a category</option>

<option value="cleaning">
    Cleaning Projects
</option>

<option value="logistics">
    Logistics Operations
</option>

<option value="consulting">
    Consulting Activities
</option>

<option value="team">
    Team Photos
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
id="description"
rows="4"
class="form-control"></textarea>

</div>

<button
id="form-submit"
type="submit"
class="btn btn-success">

Save Image

</button>

</form>

</div>

</div>

</div>
