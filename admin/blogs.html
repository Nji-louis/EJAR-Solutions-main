<!-- Main Content -->

<div class="col-md-10">

<div class="d-flex justify-content-between align-items-center mt-4 mb-4">

<h2>Manage Blogs</h2>

<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#blogModal">

<i class="bi bi-plus-circle"></i>

Add Blog

</button>

</div>

<div class="card shadow">

<div class="card-body">

<div class="table-responsive">

<table
class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Image</th>

<th>Title</th>

<th>Category</th>

<th>Status</th>

<th width="170">

Actions

</th>

</tr>

</thead>

<tbody id="blogsTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>


<!-- Add/Edit Blog Modal -->

<div
class="modal fade"
id="blogModal"
tabindex="-1">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Blog

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="blogForm">

<input
type="hidden"
id="blogId">

<div class="mb-3">

<label class="form-label">

Title

</label>

<input
type="text"
id="title"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Slug

</label>

<input
type="text"
id="slug"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Category

</label>

<input
type="text"
id="category"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Excerpt

</label>

<textarea
id="excerpt"
class="form-control"
rows="3"></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Content

</label>

<textarea
id="content"
class="form-control"
rows="10"></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Featured Image

</label>

<input
type="file"
id="image"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Author

</label>

<input
type="text"
id="author"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Meta Title

</label>

<input
type="text"
id="meta_title"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Meta Description

</label>

<textarea
id="meta_description"
class="form-control"
rows="3"></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Status

</label>

<select
id="status"
class="form-select">

<option value="published">

Published

</option>

<option value="draft">

Draft

</option>

</select>

</div>

<button
id="form-submit"
class="btn btn-success"
type="submit">

Save Blog

</button>

</form>

</div>

</div>

</div>

</div>
