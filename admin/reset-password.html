<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Reset Password | EJAR SOLUTIONS
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container">

        <div
            class="row justify-content-center align-items-center"
            style="min-height:100vh;">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h3 class="text-center mb-3">
                            EJAR SOLUTIONS
                        </h3>

                        <h5 class="text-center mb-4">
                            Reset Your Password
                        </h5>

                        <div
                            id="message"
                            class="alert d-none">
                        </div>

                        <form id="resetForm">

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    New Password

                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    minlength="8"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label
                                    for="confirmPassword"
                                    class="form-label">

                                    Confirm New Password

                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    minlength="8"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Reset Password

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const token =
            params.get("token");

        const form =
            document.getElementById(
                "resetForm"
            );

        const messageBox =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type
        ) {

            messageBox.textContent =
                text;

            messageBox.className =
                `alert alert-${type}`;

        }


        // Check token immediately

        if (!token) {

            showMessage(
                "Invalid or missing password reset link.",
                "danger"
            );

            form.style.display =
                "none";

        }


        form.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();

                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;

                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;


                if (password.length < 8) {

                    showMessage(
                        "Password must contain at least 8 characters.",
                        "danger"
                    );

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "danger"
                    );

                    return;

                }


                try {

                    const response =
                        await Api.publicPost(
                            `/auth/reset-password/${encodeURIComponent(token)}`,
                            {
                                password
                            }
                        );


                    if (response.success) {

                        showMessage(
                            response.message,
                            "success"
                        );

                        form.style.display =
                            "none";


                        setTimeout(
                            () => {

                                window.location.href =
                                    "login.html";

                            },
                            2500
                        );


                    } else {

                        showMessage(
                            response.message ||
                            "Unable to reset password.",
                            "danger"
                        );

                    }


                } catch (error) {

                    console.error(
                        "Reset Password Error:",
                        error
                    );

                    showMessage(
                        "Unable to reset password. Please try again.",
                        "danger"
                    );

                }

            }
        );

    </script>

</body>

</html>
