            <!-- Main Content -->

            <div class="col-md-10">

                <!-- Page Header -->

                <div class="d-flex justify-content-between align-items-center mt-4 mb-4">

                    <h2>

                        <i class="bi bi-people-fill"></i>

                        Manage Users

                    </h2>

                </div>

                <!-- Users Table -->

                <div class="card shadow">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-bordered table-hover align-middle">

                                <thead class="table-dark">

                                    <tr>

                                        <th>ID</th>

                                        <th>Name</th>

                                        <th>Email</th>

                                        <th>Role</th>

                                        <th>Joined</th>

                                        <th width="180">

                                            Actions

                                        </th>

                                    </tr>

                                </thead>

                                <tbody id="usersTable">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Edit User Modal -->
    <!-- ========================= -->

    <div class="modal fade"
        id="userModal"
        tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Edit User

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>

                <div class="modal-body">

                    <form id="userForm">

                        <input
                            type="hidden"
                            id="userId">

                        <div class="mb-3">

                            <label class="form-label">

                                Name

                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Role

                            </label>

                            <select
                                id="role"
                                class="form-select">

                                <option value="admin">

                                    Admin

                                </option>

                                <option value="editor">

                                    Editor

                                </option>

                            </select>

                        </div>

                        <div class="text-end">

                            <button
                                id="form-submit"
                                class="btn btn-success"
                                type="submit">

                                <i class="bi bi-check-circle-fill"></i>

                                Update User

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
