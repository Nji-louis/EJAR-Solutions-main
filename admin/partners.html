<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partners | EJAR Admin</title>

<link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
body{background:#f5f7fa;}
.sidebar{
position:fixed;left:0;top:0;width:250px;height:100vh;
background:#0b3d2e;padding:20px;color:white;overflow-y:auto;
}
.sidebar h3{text-align:center;margin-bottom:30px;}
.sidebar a{
display:block;color:white;padding:10px;text-decoration:none;
border-radius:6px;margin-bottom:6px;
}
.sidebar a:hover,.sidebar a.active{background:#146c43;}
.main{margin-left:270px;padding:30px;}
.preview-image{
width:120px;height:80px;object-fit:contain;
border:1px solid #ddd;border-radius:6px;background:#fff;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>EJAR ADMIN</h3>
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="counters.html"><i class="fa fa-chart-bar"></i> Counters</a>
    <a href="why_choose_us.html"><i class="fa fa-star"></i> Why Choose Us</a>
    <a href="partners.html" class="active"><i class="fa fa-handshake"></i> Partners</a>
    <a href="gallery.html"><i class="fa fa-images"></i> Gallery</a>
    <a href="blogs.html"><i class="fa fa-blog"></i> Blogs</a>
    <a href="testimonials.html"><i class="fa fa-comments"></i> Testimonials</a>
    <a href="faqs.html"><i class="fa fa-question-circle"></i> FAQs</a>
    <a href="messages.html"><i class="fa fa-envelope"></i> Messages</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main">

    <h2 class="mb-4">Partners</h2>

    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Partner List</span>
            <button class="btn btn-success btn-sm" id="addPartner">
                <i class="fa fa-plus"></i> Add Partner
            </button>
        </div>

        <div class="card-body">

            <table class="table table-bordered align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Logo</th>
                        <th>Name</th>
                        <th>Website</th>
                        <th>Status</th>
                        <th>Order</th>
                        <th width="180">Actions</th>
                    </tr>
                </thead>
                <tbody id="partnerTable"></tbody>
            </table>

        </div>

    </div>

</div>

<!-- Modal -->

<div class="modal fade" id="partnerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Partner</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form id="partnerForm">

                    <div class="mb-3">
                        <label class="form-label">Partner Name</label>
                        <input type="text" id="name" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Website</label>
                        <input type="text" id="website" class="form-control" placeholder="https://example.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Logo</label>
                        <input type="file" id="partnerLogo" class="form-control" accept="image/*">
                    </div>

                    <img id="partnerPreview" style="display:none;width:180px;border-radius:6px;margin-top:10px;">

                    <div class="row mt-3">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sort Order</label>
                            <input type="number" id="sort_order" class="form-control" value="0">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select id="status" class="form-control">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="savePartner">Save</button>
            </div>

        </div>
    </div>
</div>

<script src="../vendor/bootstrap/js/bootstrap.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin-guard.js"></script>
<script src="../assets/js/partners.js"></script>
<script src="../assets/js/logout.js"></script>
<script src="../assets/js/role-ui.js"></script>

</body>
</html>
