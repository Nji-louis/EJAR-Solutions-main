<!-- Main -->

<div class="col-md-10">

<div class="d-flex justify-content-between align-items-center mt-4 mb-4">

<h2>Manage FAQs</h2>

<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#faqModal">

<i class="bi bi-plus-circle"></i>

Add FAQ

</button>

</div>

<div class="card shadow">

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Question</th>

<th>Order</th>

<th>Status</th>

<th width="180">

Actions

</th>

</tr>

</thead>

<tbody id="faqTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Modal -->

<div
class="modal fade"
id="faqModal"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

FAQ

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="faqForm">

<input
type="hidden"
id="faqId">

<div class="mb-3">

<label class="form-label">

Question

</label>

<input
type="text"
id="question"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Answer

</label>

<textarea
id="answer"
rows="6"
class="form-control"
required></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Display Order

</label>

<input
type="number"
id="sort_order"
value="0"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Status

</label>

<select
id="status"
class="form-select">

<option value="active">

Active

</option>

<option value="inactive">

Inactive

</option>

</select>

</div>

<button
id="form-submit"
class="btn btn-success"
type="submit">

Save FAQ

</button>

</form>

</div>

</div>

</div>

</div>
