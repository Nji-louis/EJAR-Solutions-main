<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Forgot Password | EJAR SOLUTIONS
    </title>

    <link
        href="../vendor/bootstrap/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-3">
                        EJAR SOLUTIONS
                    </h3>

                    <h5 class="text-center mb-4">
                        Forgot Password?
                    </h5>

                    <div
                        id="message"
                        class="alert d-none">
                    </div>

                    <p class="text-muted text-center">
                        Enter your dashboard email address and
                        we will send you a password reset link.
                    </p>

                    <form id="forgotPasswordForm">

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">

                                Email Address

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Send Reset Link

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a href="login.html">
                            Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>

<script>

const form =
    document.getElementById(
        "forgotPasswordForm"
    );

const messageBox =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
) {

    messageBox.textContent =
        text;

    messageBox.className =
        `alert alert-${type}`;

}


form.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        if (!email) {

            showMessage(
                "Please enter your email address.",
                "danger"
            );

            return;

        }


        const button =
            form.querySelector(
                "button[type='submit']"
            );

        button.disabled = true;

        button.textContent =
            "Sending...";


        try {

            const response =
                await Api.publicPost(
                    "/auth/forgot-password",
                    {
                        email
                    }
                );


            if (response.success) {

                showMessage(
                    response.message ||
                    "Password reset instructions have been sent to your email.",
                    "success"
                );

                form.reset();

            } else {

                showMessage(
                    response.message ||
                    "Unable to process your request.",
                    "danger"
                );

            }


        } catch (error) {

            console.error(
                "Forgot Password Error:",
                error
            );

            showMessage(
                "Unable to connect to the server.",
                "danger"
            );

        }


        button.disabled = false;

        button.textContent =
            "Send Reset Link";

    }
);

</script>

</body>

</html>
