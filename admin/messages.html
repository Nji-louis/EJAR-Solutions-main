<h2>Contact Messages</h2>

</div>

<div class="card shadow">

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Subject</th>

<th>Status</th>

<th>Date</th>

</thead>

</tbody>

<!-- View Message Modal -->

<div
class="modal fade"
id="messageModal"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Message Details

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<div class="mb-3">

<label class="fw-bold">

Name

</label>

<p id="viewName"></p>

</div>

<div class="mb-3">

<label class="fw-bold">

Email

</label>

<p id="viewEmail"></p>

</div>

<div class="mb-3">

<label class="fw-bold">

Phone

</label>

<p id="viewPhone"></p>

</div>

<div class="mb-3">

<label class="fw-bold">

Subject

</label>

<p id="viewSubject"></p>

</div>

<div class="mb-3">

<label class="fw-bold">

Message

</label>

<p id="viewMessage"></p>

</div>

<div class="mb-3">

<label class="fw-bold">

Status

</label>

<select
id="messageStatus"
class="form-select">

<option value="new">

New

</option>

<option value="read">

Read

</option>

<option value="replied">

Replied

</option>

</select>

</div>

<button
id="updateStatusBtn"
class="btn btn-success">

Update Status

</button>

</div>
