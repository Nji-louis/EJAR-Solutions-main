<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Accept Invitation | EJAR SOLUTIONS
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container">

        <div
            class="row justify-content-center align-items-center"
            style="min-height:100vh;">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h3 class="text-center mb-3">
                            EJAR SOLUTIONS
                        </h3>

                        <h5 class="text-center mb-4">
                            Activate Your Dashboard Account
                        </h5>

                        <div
                            id="message"
                            class="alert d-none">
                        </div>

                        <form id="inviteForm">

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    Create Password

                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    minlength="8"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label
                                    for="confirmPassword"
                                    class="form-label">

                                    Confirm Password

                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    minlength="8"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Activate Account

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const token =
            params.get("token");

        const form =
            document.getElementById(
                "inviteForm"
            );

        const messageBox =
            document.getElementById(
                "message"
            );

        function showMessage(
            text,
            type
        ) {

            messageBox.textContent =
                text;

            messageBox.className =
                `alert alert-${type}`;

        }

        if (!token) {

            showMessage(
                "Invalid invitation link.",
                "danger"
            );

            form.style.display =
                "none";

        }

        form.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();

                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;

                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;

                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "danger"
                    );

                    return;

                }

                try {

                    const response =
                        await Api.publicPost(
                            "/auth/accept-invite",
                            {
                                token,
                                password
                            }
                        );

                    if (
                        response.success
                    ) {

                        showMessage(
                            response.message,
                            "success"
                        );

                        form.style.display =
                            "none";

                        setTimeout(
                            () => {

                                window.location.href =
                                    "login.html";

                            },
                            2000
                        );

                    } else {

                        showMessage(
                            response.message ||
                            "Unable to activate account.",
                            "danger"
                        );

                    }

                } catch (error) {

                    console.error(
                        error
                    );

                    showMessage(
                        "Unable to activate account.",
                        "danger"
                    );

                }

            }
        );

    </script>

</body>

</html>
